name: build-otools-plugin-standalone
run-name: "build-otools-plugin-standalone • ${{ github.event.inputs.plugin_dir }} • v${{ github.event.inputs.display_version || 'auto' }} • ref:${{ github.event.inputs.otools_ref || 'main' }}"

# 把某个插件打成**可独立安装运行的桌面 APP**（与 `.oplg` 插件包是两条独立的发布线）。
#
# 与 build-otools-plugin.yml（`.oplg`）的关键差异：
#
# 1. 产物是安装包（dmg / nsis / AppImage…）而不是 `.oplg`；
# 2. 每个插件 APP 有**独立的 updater endpoint**，固定 tag `plugin-app-<packid>` 只承载
#    `latest.json`，安装包放在版本化 tag `plugin-app-<packid>-v<version>` 上。
#    绝不能用宿主的 `/releases/latest/` —— 插件发得比宿主晚时 latest 会落到插件 release 上，
#    它没有 latest.json，于是所有宿主客户端的「检查更新」都会失败（已踩过的坑）。
# 3. 所以这里每个 job 都必须 `make_latest: false`。
#
# 前置：插件目录里必须已有 `app/` 壳（`pnpm build:plugin-app -- plugins/<dir>` 生成）。
# 目前只有 otools-git 铺开了，其余插件选到会在 discover 阶段明确失败并给出修复命令。

on:
  workflow_dispatch:
    inputs:
      otools_ref:
        description: "OTools branch/tag/SHA"
        required: false
        default: "main"
      display_version:
        description: "显示在 Actions 列表里的版本号，例如 0.2.6"
        required: false
        default: "auto"
      plugin_dir:
        description: "选择要打包独立 APP 的插件目录"
        required: true
        type: choice
        options:
          - facepack
          - gif
          - gongde-plus
          - mind-map
          - otools-aimp
          - otools-audio
          - otools-cad-viewer
          - otools-cftunnel
          - otools-container
          - otools-crop
          - otools-cutout
          - otools-dbm
          - otools-disk
          - otools-download
          - otools-easywsl
          - otools-excalidraw
          - otools-ftp
          - otools-git
          - otools-http
          - otools-idphoto
          - otools-imgup
          - otools-mac-helper
          - otools-markdown
          - otools-mqtt
          - otools-nav
          - otools-ngork
          - otools-ollama
          - otools-os-helper
          - otools-pakcap
          - otools-pic-collage
          - otools-portkill
          - otools-reqwall
          - otools-resume-helper
          - otools-scrcpy
          - otools-seal-play
          - otools-servrun
          - otools-sslgo
          - otools-starfish
          - otools-term
          - otools-tts
          - otools-vm
          - remotecrl

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packid: ${{ steps.meta.outputs.packid }}
      version: ${{ steps.meta.outputs.version }}
      display_name: ${{ steps.meta.outputs.display_name }}
      identifier: ${{ steps.meta.outputs.identifier }}
      product_name: ${{ steps.meta.outputs.product_name }}
      app_dir: ${{ steps.meta.outputs.app_dir }}
      artifact_tag: ${{ steps.meta.outputs.artifact_tag }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
    steps:
      - name: Clone OTools
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule set-url vendor/otools-plugin-sdk "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/otools-plugin-sdk.git"
          git submodule set-url vendor/tauri-remote-service "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/tauri-remote-service.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Resolve plugin app metadata
        id: meta
        working-directory: OTools
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const pluginDir = path.join('plugins', process.env.PLUGIN_DIR);
          const appDir = path.join(pluginDir, 'app');
          const confPath = path.join(appDir, 'tauri.conf.json');

          if (!fs.existsSync(path.join(pluginDir, 'plugin.json'))) {
            console.error(`插件目录不存在或缺少 plugin.json: ${pluginDir}`);
            process.exit(1);
          }
          if (!fs.existsSync(confPath)) {
            console.error(`该插件还没有独立 APP 壳：${confPath} 不存在。`);
            console.error('先生成壳并提交后再发布：');
            console.error(`  pnpm build:plugin-app -- ${pluginDir}`);
            console.error('  git add plugins/' + process.env.PLUGIN_DIR + '/app && git commit');
            process.exit(1);
          }

          const manifest = JSON.parse(fs.readFileSync(path.join(pluginDir, 'plugin.json'), 'utf8'));
          const conf = JSON.parse(fs.readFileSync(confPath, 'utf8'));
          const packid = String(manifest.packid || process.env.PLUGIN_DIR).trim();
          const version = String(conf.version || manifest.version || '').trim();
          if (!version) {
            console.error('无法从 tauri.conf.json / plugin.json 解析版本号');
            process.exit(1);
          }

          const out = process.env.GITHUB_OUTPUT;
          const write = (key, value) => fs.appendFileSync(out, `${key}=${value}\n`);
          write('packid', packid);
          write('version', version);
          write('display_name', String(manifest.displayName || packid).trim());
          write('identifier', String(conf.identifier || '').trim());
          write('product_name', String(conf.productName || packid).trim());
          write('app_dir', appDir);
          // 安装包放版本化 tag，更新清单放固定 tag（见文件头说明）
          write('artifact_tag', `plugin-app-${packid}-v${version}`);
          write('release_tag', `plugin-app-${packid}`);
          NODE
        env:
          PLUGIN_DIR: ${{ inputs.plugin_dir }}

  build-app:
    needs: discover
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
            bundles: nsis
            files: |
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/nsis/*.exe
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/nsis/*.sig
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            bundles: appimage,deb,rpm
            files: |
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/appimage/*.AppImage
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/appimage/*.sig
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/deb/*.deb
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/rpm/*.rpm
          # 这里写 dmg 是「我想要一个 DMG」的意图声明：
          # build-plugin-app-tauri.mjs 会把它改写成「只打 .app + hdiutil 造简化 DMG」，
          # 绕开 Tauri 内置 DMG 打包的 Finder AppleScript 布局（CI 里不可靠）。
          - os: macos-latest
            platform: macos
            arch: aarch64
            bundles: dmg
            files: |
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/macos/*.dmg
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/macos/*.app.tar.gz
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/macos/*.app.tar.gz.sig
          - os: macos-15-intel
            platform: macos
            arch: x86_64
            bundles: dmg
            files: |
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/macos/*.dmg
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/macos/*.app.tar.gz
              OTools/plugins/${{ inputs.plugin_dir }}/app/target/release/bundle/macos/*.app.tar.gz.sig

    runs-on: ${{ matrix.os }}

    steps:
      # 本仓库只放工作流与辅助脚本，清单生成脚本要从这里取
      - uses: actions/checkout@v4
        with:
          path: publish

      - name: Clone OTools
        shell: bash
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule set-url vendor/otools-plugin-sdk "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/otools-plugin-sdk.git"
          git submodule set-url vendor/tauri-remote-service "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/tauri-remote-service.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          # APP 是独立 workspace，target 目录在 app/ 下
          workspaces: |
            OTools/plugins/${{ inputs.plugin_dir }}/app -> OTools/plugins/${{ inputs.plugin_dir }}/app/target
          key: plugin-app-${{ inputs.plugin_dir }}-${{ matrix.os }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0 \
            patchelf \
            libpipewire-0.3-dev \
            libspeechd-dev \
            pkg-config \
            unixodbc \
            unixodbc-dev \
            libgbm-dev \
            libxdo-dev \
            libayatana-appindicator3-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install unixodbc

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: choco install sqlserver-odbcdriver -y --no-progress

      - name: Install shared frontend dependencies
        working-directory: OTools
        run: pnpm install --frozen-lockfile

      - name: Build otools-plugin-sdk
        working-directory: OTools
        run: pnpm --dir vendor/otools-plugin-sdk build

      # 壳是生成物：仓库里的文件必须与「按当前插件状态重新生成」的结果一致，
      # 否则说明命令清单或 Tauri 依赖变了却没重新生成（独立 APP 会缺功能或权限）。
      - name: Verify app shell is up to date
        working-directory: OTools
        run: node scripts/build-plugin-app.mjs "plugins/${{ inputs.plugin_dir }}" --check

      # 先构建前端（frontendDist 指向 ../dist，不存在会导致 generate_context! 编译期报错），
      # 再以 app 目录为工程根构建 APP。macOS 上会顺带造一个简化 DMG。
      - name: Build standalone app
        working-directory: OTools
        env:
          RUST_BACKTRACE: full
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/build-plugin-app-tauri.mjs \
            --plugin "plugins/${{ inputs.plugin_dir }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Upload installers to versioned tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.discover.outputs.artifact_tag }}
          name: ${{ needs.discover.outputs.artifact_tag }}
          # 4 个平台 job 并发上传同一个 tag，body 用同一份静态文案避免互相覆盖；
          # 真正的更新说明由 publish-manifest 在最后统一写入。
          body: |
            ${{ needs.discover.outputs.product_name }} 独立 APP 安装包（自动发布）。

            下载：macOS `.dmg` / Windows `-setup.exe` / Linux `.AppImage`。
            自动更新由 [`${{ needs.discover.outputs.release_tag }}`](https://github.com/${{ github.repository }}/releases/tag/${{ needs.discover.outputs.release_tag }}) 上的 `latest.json` 提供。
          draft: false
          prerelease: false
          # 关键：不能让插件 APP 的发布抢走宿主的 Latest 标记
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: ${{ matrix.files }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 每个平台产出自己的片段清单；资产 URL 指向版本化 tag（不是固定 tag）。
      - name: Generate platform manifest
        shell: bash
        working-directory: OTools
        run: |
          set -euo pipefail
          python "$GITHUB_WORKSPACE/publish/scripts/build-plugin-app-latest-json.py" platform \
            --version "${{ needs.discover.outputs.version }}" \
            --artifact-dir "plugins/${{ inputs.plugin_dir }}/app/target/release/bundle" \
            --platform "${{ matrix.os }}" \
            --arch "${{ matrix.arch }}" \
            --release-repo "${{ github.repository }}" \
            --artifact-tag "${{ needs.discover.outputs.artifact_tag }}" \
            --output "platform-latest.json"

      - name: Upload platform manifest
        uses: actions/upload-artifact@v4
        with:
          name: plugin-app-manifest-${{ matrix.os }}
          path: OTools/platform-latest.json
          if-no-files-found: error

  publish-manifest:
    needs:
      - discover
      - build-app
    if: ${{ !cancelled() && needs.build-app.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 同一插件的固定 tag 只允许串行更新，避免并发覆盖 latest.json
    concurrency:
      group: plugin-app-manifest-${{ inputs.plugin_dir }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          path: publish

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download platform manifests
        uses: actions/download-artifact@v4
        with:
          path: manifests
          pattern: plugin-app-manifest-*
          merge-multiple: true

      # 更新说明按插件目录过滤提交，与 `.oplg` 发布同一套逻辑；
      # 但要用 plugin-app 前缀，才不会把 `.oplg` 那条发布线的时间线混进来。
      - name: Build plugin changelog
        id: changelog
        continue-on-error: true
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          python publish/scripts/build-plugin-changelog.py \
            --plugin-dir "${{ inputs.plugin_dir }}" \
            --packid "${{ needs.discover.outputs.packid }}" \
            --version "${{ needs.discover.outputs.version }}" \
            --tag-prefix plugin-app \
            --token "$OTOOLS_TOKEN" \
            --output changelog.txt

      - name: Merge platform manifests
        shell: bash
        run: |
          set -euo pipefail
          notes="$(cat changelog.txt 2>/dev/null || true)"
          python publish/scripts/build-plugin-app-latest-json.py merge \
            --manifest-dir manifests \
            --version "${{ needs.discover.outputs.version }}" \
            --notes "$notes" \
            --output latest.json
          echo "--- latest.json ---"
          cat latest.json

      # 固定 tag 只承载 latest.json —— 它就是这个插件 APP 的更新端点。
      # 必须是已发布（非 draft）release，否则资产不可公开下载。
      - name: Publish updater manifest to fixed tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.discover.outputs.release_tag }}
          name: ${{ needs.discover.outputs.release_tag }}
          body: |
            ${{ needs.discover.outputs.product_name }} 独立 APP 的更新清单（自动维护，请勿手工编辑）。

            - 更新端点：`https://github.com/${{ github.repository }}/releases/download/${{ needs.discover.outputs.release_tag }}/latest.json`
            - 安装包在版本化 tag `${{ needs.discover.outputs.artifact_tag }}` 上
            - 本 release 只承载 `latest.json`，每次发布覆盖
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 把更新说明写到「安装包那个 tag」上（发布入口应该在那儿）。
      # 只更新 body，不带 files。
      - name: Update release notes on artifact tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.discover.outputs.artifact_tag }}
          name: ${{ needs.discover.outputs.artifact_tag }}
          body: |
            ## ${{ needs.discover.outputs.product_name }} v${{ needs.discover.outputs.version }}

            ${{ steps.changelog.outputs.changelog || '见产物列表下载安装包。' }}

            ---

            macOS 下载 `.dmg`，Windows 下载 `-setup.exe`，Linux 下载 `.AppImage`。
            自动更新端点：`https://github.com/${{ github.repository }}/releases/download/${{ needs.discover.outputs.release_tag }}/latest.json`
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### ${{ needs.discover.outputs.product_name }} 独立 APP"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| packid | \`${{ needs.discover.outputs.packid }}\` |"
            echo "| identifier | \`${{ needs.discover.outputs.identifier }}\` |"
            echo "| version | \`${{ needs.discover.outputs.version }}\` |"
            echo "| 安装包 tag | \`${{ needs.discover.outputs.artifact_tag }}\` |"
            echo "| 更新端点 tag | \`${{ needs.discover.outputs.release_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
