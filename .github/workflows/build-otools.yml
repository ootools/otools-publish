name: build-otools
run-name: "build-otools • v${{ github.event.inputs.display_version || 'auto' }} • ref:${{ github.event.inputs.otools_ref || 'main' }}"

on:
  workflow_dispatch:
    inputs:
      otools_ref:
        description: "OTools branch/tag/SHA"
        required: false
        default: "main"
      display_version:
        description: "显示在 Actions 列表里的版本号，例如 0.6.2"
        required: false
        default: "auto"

jobs:
  resolve_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
      - name: Clone OTools
        shell: bash
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools

      - name: Resolve release version
        id: release_version
        shell: bash
        working-directory: OTools
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ -z "$version" ]; then
            echo "Failed to resolve release version from OTools/src-tauri/tauri.conf.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: resolve_version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout publish repo
        uses: actions/checkout@v4

      - name: Clone OTools
        shell: bash
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule set-url vendor/otools-plugin-sdk "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/otools-plugin-sdk.git"
          git submodule set-url vendor/tauri-remote-service "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/tauri-remote-service.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: OTools/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            OTools/src-tauri -> OTools/target
          key: ${{ matrix.platform }}-release

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          WEBKIT_DEV_PKG="libwebkit2gtk-4.1-dev"
          sudo apt-get install -y \
            libgtk-3-dev \
            "${WEBKIT_DEV_PKG}" \
            librsvg2-dev \
            libsoup-3.0 \
            patchelf \
            libpipewire-0.3-dev \
            libspeechd-dev \
            pkg-config \
            unixodbc \
            unixodbc-dev \
            libgbm-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew install unixodbc

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install sqlserver-odbcdriver -y --no-progress

      - name: Install dependencies (Frontend)
        working-directory: OTools
        run: pnpm install --no-frozen-lockfile

      - name: Build the App (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_BACKTRACE: full
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: OTools
          args: --bundles nsis
          tagName: v${{ needs.resolve_version.outputs.version }}
          releaseName: OTools-v${{ needs.resolve_version.outputs.version }}
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false

      - name: Build the App (Linux/MacOS)
        if: matrix.platform != 'windows-latest'
        working-directory: OTools
        run: pnpm tauri:build
        env:
          RUST_BACKTRACE: full
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Release Assets (Linux/MacOS)
        if: matrix.platform != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve_version.outputs.version }}
          name: OTools-v${{ needs.resolve_version.outputs.version }}
          draft: true
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            OTools/target/**/bundle/**/*.AppImage
            OTools/target/**/bundle/**/*.deb
            OTools/target/**/bundle/**/*.rpm
            OTools/target/**/bundle/**/*.dmg
            OTools/target/**/bundle/**/*.sig
            OTools/src-tauri/target/release/bundle/**/*.AppImage
            OTools/src-tauri/target/release/bundle/**/*.deb
            OTools/src-tauri/target/release/bundle/**/*.rpm
            OTools/src-tauri/target/release/bundle/**/*.dmg
            OTools/src-tauri/target/release/bundle/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate platform latest.json
        shell: bash
        working-directory: OTools
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          import os
          import platform

          version = "${{ needs.resolve_version.outputs.version }}".lstrip("v")
          tag = f"v{version}"
          repo = "${{ github.repository }}"
          matrix_platform = "${{ matrix.platform }}"
          os_key_map = {
            "macos-latest": "darwin",
            "ubuntu-latest": "linux",
            "windows-latest": "windows",
          }
          os_key = os_key_map.get(matrix_platform, "linux")

          arch_map = {
            "x86_64": "x86_64",
            "amd64": "x86_64",
            "aarch64": "aarch64",
            "arm64": "aarch64",
            "i686": "i686",
            "i386": "i686",
            "armv7l": "armv7",
          }
          machine = platform.machine().lower()
          arch = arch_map.get(machine, machine)
          if arch not in {"x86_64", "aarch64", "i686", "armv7"}:
            arch = "x86_64"

          def detect_bundle(path: str):
            lower = path.lower()
            if lower.endswith(".app.tar.gz"):
              return "app"
            if lower.endswith(".appimage") or lower.endswith(".appimage.tar.gz"):
              return "appimage"
            if lower.endswith(".deb"):
              return "deb"
            if lower.endswith(".rpm"):
              return "rpm"
            if lower.endswith(".msi"):
              return "msi"
            if lower.endswith(".exe"):
              return "nsis"
            return ""

          allowed_bundles = {
            "linux": {"appimage", "deb", "rpm"},
            "darwin": {"app"},
            "windows": {"nsis", "msi"},
          }

          preferred = {
            "linux": ["appimage", "deb", "rpm", "nsis", "msi"],
            "darwin": ["app", "dmg"],
            "windows": ["nsis", "msi"],
          }

          candidates = []
          for pattern in (
            "target/**/bundle/**/*.sig",
            "src-tauri/target/release/bundle/**/*.sig",
          ):
            for sig_path in glob.glob(pattern, recursive=True):
              artifact_path = sig_path[:-4] if sig_path.endswith(".sig") else ""
              if not artifact_path or not os.path.isfile(artifact_path):
                continue
              bundle = detect_bundle(artifact_path)
              if not bundle:
                continue
              if bundle not in allowed_bundles.get(os_key, set()):
                continue
              with open(sig_path, "r", encoding="utf-8") as f:
                signature = f.read().strip()
              if not signature:
                continue
              candidates.append(
                {
                  "bundle": bundle,
                  "artifact_path": artifact_path,
                  "signature": signature,
                  "basename": os.path.basename(artifact_path),
                }
              )

          if not candidates:
            raise SystemExit(
              f"No updater signature/artifact pair found for {matrix_platform}."
            )

          bundle_order = {name: idx for idx, name in enumerate(preferred.get(os_key, []))}
          candidates.sort(key=lambda item: bundle_order.get(item["bundle"], 999))

          platforms = {}
          for idx, item in enumerate(candidates):
            asset_url = f"https://github.com/{repo}/releases/download/{tag}/{item['basename']}"
            if idx == 0:
              platforms[f"{os_key}-{arch}"] = {
                "signature": item["signature"],
                "url": asset_url,
              }
            platforms[f"{os_key}-{arch}-{item['bundle']}"] = {
              "signature": item["signature"],
              "url": asset_url,
            }

          output = {
            "version": version,
            "notes": "See the assets to download this version and install.",
            "platforms": platforms,
          }

          os.makedirs("updater-manifest", exist_ok=True)
          out_path = f"updater-manifest/latest-{matrix_platform}.json"
          with open(out_path, "w", encoding="utf-8") as f:
            json.dump(output, f, ensure_ascii=False, indent=2)
            f.write("\n")
          print(f"Generated {out_path}")
          PY

      - name: Upload platform latest.json
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ matrix.platform }}
          path: |
            OTools/updater-manifest/latest-*.json
            OTools/target/**/bundle/**/latest*.json
            OTools/src-tauri/target/release/bundle/**/latest*.json
          if-no-files-found: error

  publish-updater-manifest:
    needs:
      - resolve_version
      - publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout publish repo
        uses: actions/checkout@v4

      - name: Download platform updater manifests
        uses: actions/download-artifact@v4
        with:
          path: updater-manifests
          pattern: latest-json-*
          merge-multiple: true

      - name: Merge updater latest.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          import os
          import urllib.request
          import urllib.error

          version = "${{ needs.resolve_version.outputs.version }}"
          expected_version = version.lstrip("v")
          github_latest_url = f"https://github.com/${{ github.repository }}/releases/download/v{version}/latest.json"

          def load_json(path):
            with open(path, "r", encoding="utf-8") as f:
              return json.load(f)

          manifests = []
          for path in sorted(set(glob.glob("updater-manifests/**/*.json", recursive=True))):
            name = os.path.basename(path).lower()
            if not (name.startswith("latest") and name.endswith(".json")):
              continue
            try:
              data = load_json(path)
            except Exception:
              continue
            if not isinstance(data, dict):
              continue
            platforms = data.get("platforms")
            if not isinstance(platforms, dict) or not platforms:
              continue
            manifest_version = str(data.get("version", "")).strip().lstrip("v")
            if manifest_version and manifest_version != expected_version:
              continue
            manifests.append(data)

          remote_data = None
          try:
            with urllib.request.urlopen(github_latest_url) as response:
              remote_data = json.loads(response.read().decode("utf-8"))
          except urllib.error.URLError:
            remote_data = None
          except Exception:
            remote_data = None

          if not manifests and not isinstance(remote_data, dict):
            raise SystemExit(
              "No valid updater latest.json artifacts found from platform jobs, and no remote latest.json found for this tag."
            )

          merged_platforms = {}
          merged_notes = None
          merged_pub_date = None
          for item in manifests:
            platforms = item.get("platforms", {})
            for key, value in platforms.items():
              if isinstance(value, dict) and value.get("url") and value.get("signature"):
                merged_platforms[key] = value
            if merged_notes is None and item.get("notes"):
              merged_notes = str(item["notes"])
            if merged_pub_date is None and item.get("pub_date"):
              merged_pub_date = str(item["pub_date"])

          if isinstance(remote_data, dict):
            remote_platforms = remote_data.get("platforms", {})
            if isinstance(remote_platforms, dict):
              for key, value in remote_platforms.items():
                if isinstance(value, dict) and value.get("url") and value.get("signature"):
                  merged_platforms.setdefault(key, value)
            if merged_notes is None and remote_data.get("notes"):
              merged_notes = str(remote_data["notes"])
            if merged_pub_date is None and remote_data.get("pub_date"):
              merged_pub_date = str(remote_data["pub_date"])

          if not merged_platforms:
            raise SystemExit("Merged updater manifest has no valid platforms.")

          output = {
            "version": expected_version,
            "notes": merged_notes or "See the assets to download this version and install.",
            "pub_date": merged_pub_date,
            "platforms": dict(sorted(merged_platforms.items(), key=lambda pair: pair[0])),
          }
          with open("latest.json", "w", encoding="utf-8") as out:
            json.dump(output, out, ensure_ascii=False, indent=2)
            out.write("\n")
          PY

      - name: Upload merged latest.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve_version.outputs.version }}
          files: latest.json
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


