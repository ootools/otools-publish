name: build-otools
run-name: "build-otools • v${{ github.event.inputs.display_version || 'auto' }} • ref:${{ github.event.inputs.otools_ref || 'main' }}"

on:
  workflow_dispatch:
    inputs:
      otools_ref:
        description: "OTools branch/tag/SHA"
        required: false
        default: "main"
      display_version:
        description: "显示在 Actions 列表里的版本号，例如 0.6.2"
        required: false
        default: "auto"
      build_platform:
        description: "all=四平台正式发布；linux/windows=单平台诊断补跑（不会覆盖合并后的 latest.json）"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - linux
          - windows

jobs:
  resolve_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release_version.outputs.version }}
    steps:
      - name: Clone OTools
        shell: bash
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools

      - name: Resolve release version
        id: release_version
        shell: bash
        working-directory: OTools
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ -z "$version" ]; then
            echo "Failed to resolve release version from OTools/src-tauri/tauri.conf.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: resolve_version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # linux-only 只起一个 job，便于单独复现 Ubuntu 打包问题；
        # 该模式下 publish-updater-manifest 会被跳过，避免只含 linux 的清单覆盖全平台 Latest。
        platform: ${{ fromJSON(github.event.inputs.build_platform == 'linux' && '["ubuntu-24.04"]' || github.event.inputs.build_platform == 'windows' && '["windows-2022"]' || '["windows-2022","macos-latest","macos-15-intel","ubuntu-24.04"]') }}

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout publish repo
        uses: actions/checkout@v4

      - name: Clone OTools
        shell: bash
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule set-url vendor/otools-plugin-sdk "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/otools-plugin-sdk.git"
          git submodule set-url vendor/tauri-remote-service "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/tauri-remote-service.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: OTools/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          # rust-cache 的 `-> target` 是相对 workspace 根解析的，不是相对仓库根：
          # 原来写 `OTools/src-tauri -> OTools/target` 实际指向
          # `OTools/src-tauri/OTools/target`（不存在），缓存里只有 cargo registry，
          # 编译产物从未入库，Linux 每次发布都是 30 分钟以上的全量冷编译。
          workspaces: |
            OTools/src-tauri -> ../target
          key: ${{ matrix.platform }}-release
          # 只给 Linux 缓存 release 依赖产物：4 个平台各存一份 GB 级 target
          # 会挤爆仓库 10 GiB 的 Actions 缓存配额，其它平台只缓存 registry 即可。
          cache-targets: ${{ startsWith(matrix.platform, 'ubuntu') }}
          # 构建步骤正常失败时也要存下已编译产物。注意 runner 被 OOM 强制回收
          # 会取消整个 job，post 步骤不会执行，那种情况只能靠不 OOM 来解。
          cache-on-failure: true

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          WEBKIT_DEV_PKG="libwebkit2gtk-4.1-dev"
          sudo apt-get install -y \
            libgtk-3-dev \
            "${WEBKIT_DEV_PKG}" \
            librsvg2-dev \
            libsoup-3.0 \
            patchelf \
            libpipewire-0.3-dev \
            libspeechd-dev \
            pkg-config \
            unixodbc \
            unixodbc-dev \
            libgbm-dev

      - name: Install dependencies (macOS)
        if: startsWith(matrix.platform, 'macos-')
        run: |
          brew update
          brew install unixodbc

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-2022'
        run: choco install sqlserver-odbcdriver -y --no-progress

      - name: Install dependencies (Frontend)
        working-directory: OTools
        run: pnpm install --no-frozen-lockfile

      - name: Build the App (Windows)
        if: matrix.platform == 'windows-2022'
        uses: tauri-apps/tauri-action@v0
        env:
          # Avoid the Windows runner OOM observed during host LLVM codegen.
          # Preserve debug=1/PDB generation; scope memory overrides to Windows only.
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 2
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 16
          CARGO_BUILD_JOBS: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_BACKTRACE: full
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: OTools
          args: --bundles nsis
          tagName: v${{ needs.resolve_version.outputs.version }}
          releaseName: OTools-v${{ needs.resolve_version.outputs.version }}
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false

      # 崩溃诊断依赖符号：Windows 上 LocalDumps 抓到的 minidump 若没有匹配的
      # PDB 就无法把地址还原成函数名，排查就只能靠猜。
      # 根 Cargo.toml 的 [profile.release] 设 debug = 1（行号表），因此这里
      # 需要收集 PDB。
      #
      # ⚠️ 只上传到 CI artifact，**不进 release 资产**。PDB 能把 exe 还原成
      # 带函数名/行号的结构，随release 公开等于把内部实现交给任何人。
      # 自用排查时从本次运行的 Actions 页下载 artifact 即可。
      # 暂存目录刻意放在 release-assets/ 之外，避免被下面的 assets glob 误捞。
      - name: Stage Debug Symbols (Windows)
        if: matrix.platform == 'windows-2022'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${{ needs.resolve_version.outputs.version }}"
          $stageDir = "OTools/debug-symbols"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          # tauri-action 的构建产物目录，两个候选都检查一遍。
          $pdbs = @()
          foreach ($candidate in @(
              "OTools/src-tauri/target/release",
              "OTools/target/release")) {
            if (Test-Path $candidate) {
              $pdbs += Get-ChildItem -Path $candidate -Filter '*.pdb' -Recurse -ErrorAction SilentlyContinue
            }
          }
          if ($pdbs.Count -eq 0) {
            Write-Host "No PDB produced; debug=1 in [profile.release] may have been overridden." -Warning
            exit 0
          }

          foreach ($pdb in $pdbs) {
            $dest = Join-Path $stageDir ("{0}_{1}.pdb" -f $pdb.BaseName, $version)
            Copy-Item -Path $pdb.FullName -Destination $dest -Force
            Write-Host "Staged $dest"
          }

      - name: Upload Debug Symbols artifact (Windows)
        if: matrix.platform == 'windows-2022'
        uses: actions/upload-artifact@v4
        with:
          name: otools-debug-symbols-${{ needs.resolve_version.outputs.version }}
          path: OTools/debug-symbols/*.pdb
          if-no-files-found: warn
          retention-days: 90

      - name: Add Linux build swap (safety net for release link)
        if: matrix.platform == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euxo pipefail
          # runner 自带 3 GiB swap 不够：历史 fat-LTO 链接 cgroup 峰值
          # 到 15-16 GiB，实测 memory.events 出现 oom_kill=1 后 runner 被强制回收。
          # Linux 已改用 thin LTO 压低峰值，这里保留额外 swap 只是兜底，
          # 避免偶发峰值再次触发 OOM 回收（thin LTO 下基本不会用到）。
          sudo fallocate -l 12G /mnt/swapfile-extra
          sudo chmod 600 /mnt/swapfile-extra
          sudo mkswap /mnt/swapfile-extra
          sudo swapon /mnt/swapfile-extra
          swapon --show
          free -h

      - name: Build the App (Linux/MacOS)
        if: matrix.platform != 'windows-2022'
        working-directory: OTools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.platform }}" == 'ubuntu-24.04' ]]; then
            # 0.9.0 Linux 排查结论（截至 run 43196929061）：
            # - 依赖 crate 约 18 分钟编完，之后主 crate `src-tauri` 的单个
            #   rustc 反复出现 ~14.7 GiB 匿名页峰值（10:24:44、10:38:48 两次），
            #   随后 swap 吃到 14.4 GiB、MemAvailable 0.2 GiB、pgscan 7.5e7，
            #   进入换页死锁，60 分钟 timeout 掐断（exit 124）。
            # - codegen-units 从 1 改 16、再改回 1，峰值都不变 ⇒ 不是 CGU 拆分问题。
            # - 本地 `cargo check -p OTools`（expansion + typeck，不含 MIR/LLVM）
            #   峰值不足 1 GiB ⇒ 前端不是元凶，14.7 GiB 全在 MIR 优化 + LLVM codegen。
            # - 仓库规模：`src-tauri/src` 自 11-08 成功构建（43,287 行）涨到
            #   65,766 行（+52%），其中 platform/ 56,318 行。16 GiB runner 装不下。
            #
            # 因此 Linux 分支把 opt-level 从 3 降到 2：MIR 内联与 LLVM 优化都降一档，
            # 直接压 codegen 峰值；配合 LTO=off、debug=0、单 rustc 作业。
            # Cargo 环境变量优先级高于 Cargo.toml，仓库配置一字不动；
            # macOS/Windows 保持 fat LTO + opt-level=3 完整优化。
            #
            # timeout 让卡死以「步骤失败」收尾（整跑被取消不会执行 post 步骤），
            # 这样 always() 的诊断上传和 rust-cache 的 cache-on-failure 保存
            # 都能执行，下一轮可增量复用 target。
            # 60m → 120m：拆出 ot-platform-core 后实测 `Finished release profile
            # in 59m 05s`，紧接着才开始 AppImage 打包，60m 上限只差 43 秒就把
            # 已编译好的产物打掉（exit 124）。上限必须覆盖编译 + 打包全流程。
            export CARGO_PROFILE_RELEASE_OPT_LEVEL=2
            export CARGO_PROFILE_RELEASE_LTO=off
            export CARGO_PROFILE_RELEASE_DEBUG=0
            export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
            export CARGO_BUILD_JOBS=1
            python3 scripts/ci-build-diagnostics.py \
              --output-dir build-diagnostics \
              --interval 30 \
              -- timeout -k 30 120m pnpm tauri:build
          else
            pnpm tauri:build
          fi
        env:
          RUST_BACKTRACE: full
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Linux build diagnostics
        if: always() && matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: otools-build-diagnostics-${{ needs.resolve_version.outputs.version }}-${{ github.run_id }}
          path: OTools/build-diagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Stage macOS release assets by architecture
        if: startsWith(matrix.platform, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.resolve_version.outputs.version }}"
          if [[ "${{ matrix.platform }}" == 'macos-15-intel' ]]; then
            platform='darwin-x86_64'
          else
            platform='darwin-aarch64'
          fi
          bundle_dir=''
          for candidate in OTools/src-tauri/target/release/bundle OTools/target/release/bundle; do
            if [[ -d "$candidate/macos" ]]; then
              bundle_dir="$candidate"
              break
            fi
          done
          if [[ -z "$bundle_dir" ]]; then
            echo 'Missing macOS app bundle directory' >&2
            exit 1
          fi
          node OTools/scripts/stage-release-assets.mjs \
            --bundle-dir "$bundle_dir" \
            --dest "OTools/release-assets/$platform" \
            --platform "$platform" \
            --version "$version"
          test -s "OTools/release-assets/$platform/OTools_${version}_${platform#darwin-}.app.tar.gz"
          test -s "OTools/release-assets/$platform/OTools_${version}_${platform#darwin-}.app.tar.gz.sig"

      - name: Upload Release Assets (Linux)
        if: matrix.platform == 'ubuntu-24.04'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve_version.outputs.version }}
          name: OTools-v${{ needs.resolve_version.outputs.version }}
          draft: true
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            OTools/target/**/bundle/**/*.AppImage
            OTools/target/**/bundle/**/*.deb
            OTools/target/**/bundle/**/*.rpm
            OTools/target/**/bundle/**/*.sig
            OTools/src-tauri/target/release/bundle/**/*.AppImage
            OTools/src-tauri/target/release/bundle/**/*.deb
            OTools/src-tauri/target/release/bundle/**/*.rpm
            OTools/src-tauri/target/release/bundle/**/*.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (macOS)
        if: startsWith(matrix.platform, 'macos-')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve_version.outputs.version }}
          name: OTools-v${{ needs.resolve_version.outputs.version }}
          draft: true
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            OTools/release-assets/**/*.dmg
            OTools/release-assets/**/*.app.tar.gz
            OTools/release-assets/**/*.app.tar.gz.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate platform latest.json
        shell: bash
        working-directory: OTools
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          import os
          import platform

          version = "${{ needs.resolve_version.outputs.version }}".lstrip("v")
          tag = f"v{version}"
          repo = "${{ github.repository }}"
          matrix_platform = "${{ matrix.platform }}"
          os_key_map = {
            "macos-latest": "darwin",
            "macos-15-intel": "darwin",
            "ubuntu-24.04": "linux",
            "windows-2022": "windows",
          }
          os_key = os_key_map.get(matrix_platform, "linux")

          arch_map = {
            "x86_64": "x86_64",
            "amd64": "x86_64",
            "aarch64": "aarch64",
            "arm64": "aarch64",
            "i686": "i686",
            "i386": "i686",
            "armv7l": "armv7",
          }
          machine = platform.machine().lower()
          arch = arch_map.get(machine, machine)
          if arch not in {"x86_64", "aarch64", "i686", "armv7"}:
            arch = "x86_64"

          def detect_bundle(path: str):
            lower = path.lower()
            if lower.endswith(".app.tar.gz"):
              return "app"
            if lower.endswith(".appimage") or lower.endswith(".appimage.tar.gz"):
              return "appimage"
            if lower.endswith(".deb"):
              return "deb"
            if lower.endswith(".rpm"):
              return "rpm"
            if lower.endswith(".msi"):
              return "msi"
            if lower.endswith(".exe"):
              return "nsis"
            return ""

          allowed_bundles = {
            "linux": {"appimage", "deb", "rpm"},
            "darwin": {"app"},
            "windows": {"nsis", "msi"},
          }

          preferred = {
            "linux": ["appimage", "deb", "rpm", "nsis", "msi"],
            "darwin": ["app", "dmg"],
            "windows": ["nsis", "msi"],
          }

          candidates = []
          signature_patterns = (
            ("release-assets/**/*.app.tar.gz.sig",)
            if os_key == "darwin"
            else (
              "target/**/bundle/**/*.sig",
              "src-tauri/target/release/bundle/**/*.sig",
            )
          )
          for pattern in signature_patterns:
            for sig_path in glob.glob(pattern, recursive=True):
              artifact_path = sig_path[:-4] if sig_path.endswith(".sig") else ""
              if not artifact_path or not os.path.isfile(artifact_path):
                continue
              bundle = detect_bundle(artifact_path)
              if not bundle:
                continue
              if bundle not in allowed_bundles.get(os_key, set()):
                continue
              with open(sig_path, "r", encoding="utf-8") as f:
                signature = f.read().strip()
              if not signature:
                continue
              candidates.append(
                {
                  "bundle": bundle,
                  "artifact_path": artifact_path,
                  "signature": signature,
                  "basename": os.path.basename(artifact_path),
                }
              )

          if not candidates:
            raise SystemExit(
              f"No updater signature/artifact pair found for {matrix_platform}."
            )

          bundle_order = {name: idx for idx, name in enumerate(preferred.get(os_key, []))}
          candidates.sort(key=lambda item: bundle_order.get(item["bundle"], 999))

          platforms = {}
          for idx, item in enumerate(candidates):
            asset_url = f"https://github.com/{repo}/releases/download/{tag}/{item['basename']}"
            if idx == 0:
              platforms[f"{os_key}-{arch}"] = {
                "signature": item["signature"],
                "url": asset_url,
              }
            platforms[f"{os_key}-{arch}-{item['bundle']}"] = {
              "signature": item["signature"],
              "url": asset_url,
            }

          output = {
            "version": version,
            "notes": "See the assets to download this version and install.",
            "platforms": platforms,
          }

          os.makedirs("updater-manifest", exist_ok=True)
          out_path = f"updater-manifest/latest-{matrix_platform}.json"
          with open(out_path, "w", encoding="utf-8") as f:
            json.dump(output, f, ensure_ascii=False, indent=2)
            f.write("\n")
          print(f"Generated {out_path}")
          PY

      - name: Upload platform latest.json
        uses: actions/upload-artifact@v4
        with:
          name: latest-json-${{ matrix.platform }}
          path: |
            OTools/updater-manifest/latest-*.json
            OTools/target/**/bundle/**/latest*.json
            OTools/src-tauri/target/release/bundle/**/latest*.json
          if-no-files-found: error

  publish-updater-manifest:
    # linux-only 是诊断重跑：此时只有 linux-x86_64 一个平台的清单片段，
    # 合并上传会把正式 latest.json 覆盖成单平台，导致其它客户端检查更新失效。
    if: github.event.inputs.build_platform != 'linux' && github.event.inputs.build_platform != 'windows'
    needs:
      - resolve_version
      - publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout publish repo
        uses: actions/checkout@v4

      - name: Download platform updater manifests
        uses: actions/download-artifact@v4
        with:
          path: updater-manifests
          pattern: latest-json-*
          merge-multiple: true

      - name: Generate host changelog
        id: changelog
        continue-on-error: true
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/build-host-changelog.py \
            --version "${{ needs.resolve_version.outputs.version }}" \
            --token "$OTOOLS_TOKEN" \
            --github-output --output changelog.txt

      - name: Merge updater latest.json
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import glob
          import json
          import os
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          version = "${{ needs.resolve_version.outputs.version }}"
          expected_version = version.lstrip("v")
          github_latest_url = f"https://github.com/${{ github.repository }}/releases/download/v{version}/latest.json"

          def load_json(path):
            with open(path, "r", encoding="utf-8") as f:
              return json.load(f)

          manifests = []
          for path in sorted(set(glob.glob("updater-manifests/**/*.json", recursive=True))):
            name = os.path.basename(path).lower()
            if not (name.startswith("latest") and name.endswith(".json")):
              continue
            try:
              data = load_json(path)
            except Exception:
              continue
            if not isinstance(data, dict):
              continue
            platforms = data.get("platforms")
            if not isinstance(platforms, dict) or not platforms:
              continue
            manifest_version = str(data.get("version", "")).strip().lstrip("v")
            if manifest_version and manifest_version != expected_version:
              continue
            manifests.append(data)

          remote_data = None
          try:
            with urllib.request.urlopen(github_latest_url) as response:
              remote_data = json.loads(response.read().decode("utf-8"))
          except urllib.error.URLError:
            remote_data = None
          except Exception:
            remote_data = None

          if not manifests and not isinstance(remote_data, dict):
            raise SystemExit(
              "No valid updater latest.json artifacts found from platform jobs, and no remote latest.json found for this tag."
            )

          merged_platforms = {}
          merged_notes = None
          merged_pub_date = None
          for item in manifests:
            platforms = item.get("platforms", {})
            for key, value in platforms.items():
              if isinstance(value, dict) and value.get("url") and value.get("signature"):
                merged_platforms[key] = value
            if merged_notes is None and item.get("notes"):
              merged_notes = str(item["notes"])
            if merged_pub_date is None and item.get("pub_date"):
              merged_pub_date = str(item["pub_date"])

          if isinstance(remote_data, dict):
            remote_platforms = remote_data.get("platforms", {})
            if isinstance(remote_platforms, dict):
              for key, value in remote_platforms.items():
                if isinstance(value, dict) and value.get("url") and value.get("signature"):
                  merged_platforms.setdefault(key, value)
            if merged_notes is None and remote_data.get("notes"):
              merged_notes = str(remote_data["notes"])
            if merged_pub_date is None and remote_data.get("pub_date"):
              merged_pub_date = str(remote_data["pub_date"])

          if not merged_platforms:
            raise SystemExit("Merged updater manifest has no valid platforms.")

          changelog_path = "changelog.txt"
          host_changelog = ""
          if os.path.isfile(changelog_path):
              with open(changelog_path, "r", encoding="utf-8") as _cf:
                  host_changelog = _cf.read().strip()
          notes = host_changelog or merged_notes or "See the assets to download this version and install."
          output = {
            "version": expected_version,
            "notes": notes,
            "pub_date": merged_pub_date or datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "platforms": dict(sorted(merged_platforms.items(), key=lambda pair: pair[0])),
          }
          with open("latest.json", "w", encoding="utf-8") as out:
            json.dump(output, out, ensure_ascii=False, indent=2)
            out.write("\n")
          PY

      - name: Upload merged latest.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve_version.outputs.version }}
          body_path: changelog.txt
          files: latest.json
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


