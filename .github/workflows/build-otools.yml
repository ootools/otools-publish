name: build-otools
run-name: "build-otools • v${{ github.event.inputs.display_version || 'auto' }} • ref:${{ github.event.inputs.otools_ref || 'dev' }}"

on:
  workflow_dispatch:
    inputs:
      otools_ref:
        description: "OTools branch/tag/SHA"
        required: false
        default: "dev"
      display_version:
        description: "显示在 Actions 列表里的版本号，例如 0.6.2"
        required: false
        default: "auto"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout publish repo
        uses: actions/checkout@v4

      - name: Clone OTools
        shell: bash
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule set-url vendor/otools-plugin-sdk "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/otools-plugin-sdk.git"
          git submodule set-url vendor/tauri-remote-service "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/tauri-remote-service.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: OTools/pnpm-lock.yaml

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            OTools/src-tauri -> OTools/target
          key: ${{ matrix.platform }}-release

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          WEBKIT_DEV_PKG="libwebkit2gtk-4.1-dev"
          sudo apt-get install -y \
            libgtk-3-dev \
            "${WEBKIT_DEV_PKG}" \
            librsvg2-dev \
            libsoup-3.0 \
            patchelf \
            libpipewire-0.3-dev \
            libspeechd-dev \
            linux-headers-$(uname -r) \
            pkg-config \
            unixodbc \
            unixodbc-dev \
            libgbm-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew install unixodbc

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install sqlserver-odbcdriver -y --no-progress

      - name: Install dependencies (Frontend)
        working-directory: OTools
        run: pnpm install --no-frozen-lockfile

      - name: Resolve release version
        id: release_version
        shell: bash
        working-directory: OTools
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ -z "$version" ]; then
            echo "Failed to resolve release version from OTools/src-tauri/tauri.conf.json" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the App (Windows)
        if: matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_BACKTRACE: full
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: OTools
          args: --bundles nsis
          tagName: v${{ steps.release_version.outputs.version }}
          releaseName: OTools-v${{ steps.release_version.outputs.version }}
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true

      - name: Build the App (Linux/MacOS)
        if: matrix.platform != 'windows-latest'
        working-directory: OTools
        run: pnpm tauri-build
        env:
          RUST_BACKTRACE: full
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Release Assets (Linux/MacOS)
        if: matrix.platform != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          name: OTools-v${{ steps.release_version.outputs.version }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            OTools/target/**/bundle/**/*.AppImage
            OTools/target/**/bundle/**/*.deb
            OTools/target/**/bundle/**/*.rpm
            OTools/target/**/bundle/**/*.dmg
            OTools/target/**/bundle/**/*.sig
            OTools/target/**/bundle/**/latest.json
            OTools/src-tauri/target/release/bundle/**/*.AppImage
            OTools/src-tauri/target/release/bundle/**/*.deb
            OTools/src-tauri/target/release/bundle/**/*.rpm
            OTools/src-tauri/target/release/bundle/**/*.dmg
            OTools/src-tauri/target/release/bundle/**/*.sig
            OTools/src-tauri/target/release/bundle/**/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
