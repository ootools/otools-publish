name: build-otools-plugin

on:
  workflow_dispatch:
    inputs:
      otools_ref:
        description: 'OTools branch/tag/SHA'
        required: false
        default: 'dev'
      plugin_dir:
        description: 'Plugin dir under plugins/, e.g. otools-download'
        required: true
        default: 'otools-download'
      build_script:
        description: 'pnpm script in plugin'
        required: false
        default: 'build'

jobs:
  build-otools-plugin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout publish repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Clone OTools
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule update --init --recursive

      - name: Install root dependencies
        working-directory: OTools
        run: pnpm install --frozen-lockfile

      - name: Validate plugin directory
        env:
          PLUGIN_DIR: ${{ github.event.inputs.plugin_dir }}
        run: |
          if [ ! -d "OTools/plugins/$PLUGIN_DIR" ]; then
            echo "Plugin directory not found: OTools/plugins/$PLUGIN_DIR"
            exit 1
          fi

      - name: Build plugin
        working-directory: OTools/plugins/${{ github.event.inputs.plugin_dir }}
        env:
          BUILD_SCRIPT: ${{ github.event.inputs.build_script }}
        run: pnpm run "$BUILD_SCRIPT"

      - name: Upload plugin dist artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otools-plugin-dist-${{ github.event.inputs.plugin_dir }}
          path: |
            OTools/plugins/${{ github.event.inputs.plugin_dir }}/dist
          if-no-files-found: warn
