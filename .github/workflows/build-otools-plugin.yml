name: build-otools-plugin
run-name: "build-otools-plugin • ${{ github.event.inputs.plugin_dir }} • v${{ github.event.inputs.display_version || 'auto' }} • ref:${{ github.event.inputs.otools_ref || 'main' }}"

on:
  workflow_dispatch:
    inputs:
      otools_ref:
        description: "OTools branch/tag/SHA"
        required: false
        default: "main"
      display_version:
        description: "显示在 Actions 列表里的版本号，例如 0.1.0"
        required: false
        default: "auto"
      plugin_dir:
        description: "选择要打包的插件目录"
        required: true
        type: choice
        options:
          - facepack
          - gif
          - gongde-plus
          - mind-map
          - otools-aimp
          - otools-audio
          - otools-cad-viewer
          - otools-cftunnel
          - otools-container
          - otools-crop
          - otools-cutout
          - otools-dbm
          - otools-disk
          - otools-download
          - otools-easywsl
          - otools-excalidraw
          - otools-ftp
          - otools-git
          - otools-http
          - otools-idphoto
          - otools-imgup
          - otools-mac-helper
          - otools-markdown
          - otools-mqtt
          - otools-nav
          - otools-ngork
          - otools-ollama
          - otools-os-helper
          - otools-pakcap
          - otools-pic-collage
          - otools-portkill
          - otools-reqwall
          - otools-resume-helper
          - otools-seal-play
          - otools-servrun
          - otools-sslgo
          - otools-starfish
          - otools-term
          - otools-tts
          - otools-vm
          - remotecrl

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      adapter_root: ${{ steps.meta.outputs.adapter_root }}
      packid: ${{ steps.meta.outputs.packid }}
      uuid: ${{ steps.meta.outputs.uuid }}
      version: ${{ steps.meta.outputs.version }}
      has_web: ${{ steps.meta.outputs.has_web }}
      has_native: ${{ steps.meta.outputs.has_native }}
      has_logo: ${{ steps.meta.outputs.has_logo }}
      logo_path: ${{ steps.meta.outputs.logo_path }}
    steps:
      - name: Clone OTools
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule set-url vendor/otools-plugin-sdk "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/otools-plugin-sdk.git"
          git submodule set-url vendor/tauri-remote-service "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/tauri-remote-service.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - id: meta
        shell: bash
        working-directory: OTools
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          plugin_dir = os.path.join("plugins", "${{ inputs.plugin_dir }}")
          raw = subprocess.check_output(
              ["python", "scripts/plugin_pack.py", "meta", plugin_dir],
              text=True,
          )
          meta = json.loads(raw)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              for key in (
                  "adapter_root",
                  "packid",
                  "uuid",
                  "version",
                  "has_web",
                  "has_native",
                  "has_logo",
                  "logo_path",
              ):
                  value = meta.get(key, "")
                  if isinstance(value, bool):
                      value = "true" if value else "false"
                  fh.write(f"{key}={value}\n")
          PY

      # 直接检查文件，不依赖 plugin_pack.py 的输出格式，
      # 也不受 otools_ref 指向旧版本分支的影响。
      - name: Require plugin logo
        shell: bash
        run: |
          logo="OTools/plugins/${{ inputs.plugin_dir }}/logo.svg"
          if [ ! -f "$logo" ]; then
            echo "插件市场要求每个插件根目录必须提供 logo.svg，当前未找到：" >&2
            echo "  plugins/${{ inputs.plugin_dir }}/logo.svg" >&2
            echo "请先补充该文件后重新发布。" >&2
            exit 1
          fi
          echo "插件 logo: $logo"

  build-web:
    needs: discover
    if: needs.discover.outputs.has_web == 'True' || needs.discover.outputs.has_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone OTools
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule set-url vendor/otools-plugin-sdk "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/otools-plugin-sdk.git"
          git submodule set-url vendor/tauri-remote-service "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/tauri-remote-service.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install shared frontend dependencies
        working-directory: OTools
        run: pnpm install --frozen-lockfile

      - name: Build otools-plugin-sdk
        working-directory: OTools
        run: pnpm --dir vendor/otools-plugin-sdk build

      - name: Build plugin web assets
        working-directory: OTools
        run: pnpm build:plugin -- "${{ inputs.plugin_dir }}"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-web-${{ inputs.plugin_dir }}
          path: OTools/${{ needs.discover.outputs.adapter_root }}/dist
          if-no-files-found: error

  build-native:
    needs: discover
    if: needs.discover.outputs.has_native == 'True' || needs.discover.outputs.has_native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: windows
            output_name: Windows.dll
          - os: ubuntu-latest
            platform: linux
            artifact_name: linux
            output_name: Linux.so
          - os: macos-latest
            platform: macos
            artifact_name: macos-arm64
            output_name: macOS-arm64.dylib
          - os: macos-15-intel
            platform: macos
            artifact_name: macos-x86_64
            output_name: macOS-x86_64.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone OTools
        shell: bash
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule set-url vendor/otools-plugin-sdk "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/otools-plugin-sdk.git"
          git submodule set-url vendor/tauri-remote-service "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/tauri-remote-service.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            OTools/${{ needs.discover.outputs.adapter_root }}/native -> OTools/${{ needs.discover.outputs.adapter_root }}/native/target
          key: plugin-${{ inputs.plugin_dir }}-${{ matrix.artifact_name }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libsoup-3.0 \
            patchelf \
            libpipewire-0.3-dev \
            libspeechd-dev \
            pkg-config \
            unixodbc \
            unixodbc-dev \
            libgbm-dev

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos'
        run: |
          brew update
          brew install unixodbc

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: choco install sqlserver-odbcdriver -y --no-progress

      - name: Build native library
        shell: bash
        run: cargo build --manifest-path "OTools/${{ needs.discover.outputs.adapter_root }}/native/Cargo.toml" --release --target-dir "OTools/${{ needs.discover.outputs.adapter_root }}/native/target"

      - name: Stage native library
        shell: bash
        run: |
          mkdir -p artifacts/lib
          native_path="$(python OTools/scripts/plugin_pack.py locate-native-lib "OTools/plugins/${{ inputs.plugin_dir }}" "${{ matrix.platform }}" "OTools/${{ needs.discover.outputs.adapter_root }}/native/target/release")"
          python OTools/scripts/plugin_pack.py stage-native "OTools/plugins/${{ inputs.plugin_dir }}" "${{ matrix.platform }}" "$native_path" artifacts/lib --output-name "${{ matrix.output_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-native-${{ matrix.artifact_name }}
          path: artifacts/lib/*
          if-no-files-found: error

  package:
    needs:
      - discover
      - build-web
      - build-native
    outputs:
      # 插件专属的更新说明（按 plugins/<插件目录> 过滤提交生成）。
      # 本 job 用它写 Release body，sync-market 用它同步到插件市场。
      changelog: ${{ steps.changelog.outputs.changelog }}
    if: |
      always() &&
      needs.discover.result == 'success' &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-native.result == 'success' || needs.build-native.result == 'skipped')
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Clone OTools
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule set-url vendor/otools-plugin-sdk "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/otools-plugin-sdk.git"
          git submodule set-url vendor/tauri-remote-service "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/tauri-remote-service.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Download web artifact
        if: needs.discover.outputs.has_web == 'True' || needs.discover.outputs.has_web == 'true'
        uses: actions/download-artifact@v4
        with:
          name: plugin-web-${{ inputs.plugin_dir }}
          path: OTools/${{ needs.discover.outputs.adapter_root }}/dist

      - name: Download native artifacts
        if: needs.discover.outputs.has_native == 'True' || needs.discover.outputs.has_native == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: plugin-native-*
          merge-multiple: true
          path: OTools/${{ needs.discover.outputs.adapter_root }}/lib

      - name: Merge and ad-hoc sign macOS native library
        if: needs.discover.outputs.has_native == 'True' || needs.discover.outputs.has_native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lib_dir="OTools/${{ needs.discover.outputs.adapter_root }}/lib"
          arm_path="$lib_dir/macOS-arm64.dylib"
          intel_path="$lib_dir/macOS-x86_64.dylib"
          universal_path="$lib_dir/macOS.dylib"
          if [[ ! -f "$arm_path" || ! -f "$intel_path" ]]; then
            echo "Missing both macOS native architectures in $lib_dir" >&2
            find "$lib_dir" -maxdepth 1 -type f -print >&2
            exit 1
          fi
          lipo -create "$arm_path" "$intel_path" -output "$universal_path"
          codesign --force --sign - --timestamp=none "$universal_path"
          rm -f "$arm_path" "$intel_path"

      - name: Pack plugin zip
        shell: bash
        run: |
          mkdir -p artifacts
          zip_path="artifacts/${{ needs.discover.outputs.packid }}-${{ needs.discover.outputs.version }}.oplg"
          python OTools/scripts/plugin_pack.py zip "OTools/plugins/${{ inputs.plugin_dir }}" "$zip_path"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-pack-${{ needs.discover.outputs.packid }}
          path: artifacts/*.oplg
          if-no-files-found: error

      # Actions artifact downloads re-zip the payload, which would wrap the
      # .oplg inside an extra zip layer. Upload it as a raw release asset so
      # the downloaded file is the plugin package itself.
      - uses: actions/checkout@v4
        with:
          path: publish

      # 生成插件自己的更新说明：按 plugins/<插件目录> 过滤提交，
      # 所以只包含本插件的改动，不会串进宿主或其他插件的提交。
      # 拿不到提交（例如首次发布、令牌失效）时输出为空，不阻断发布。
      - name: Build plugin changelog
        id: changelog
        continue-on-error: true
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
        run: |
          set -euo pipefail
          python publish/scripts/build-plugin-changelog.py \
            --plugin-dir "${{ inputs.plugin_dir }}" \
            --packid "${{ needs.discover.outputs.packid }}" \
            --version "${{ needs.discover.outputs.version }}" \
            --token "$OTOOLS_TOKEN" \
            --github-output

      - name: Publish plugin release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-${{ needs.discover.outputs.packid }}-v${{ needs.discover.outputs.version }}
          name: ${{ needs.discover.outputs.packid }}-v${{ needs.discover.outputs.version }}
          body: |
            ## ${{ needs.discover.outputs.packid }} v${{ needs.discover.outputs.version }}

            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: artifacts/*.oplg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 把本次发布同步到插件市场：
  # 1. 校验插件根目录的 logo.svg（discover 已校验，这里再兜底一次）；
  # 2. 把 logo.svg 提交到 otools-website 仓库，由 Pages 站点托管为
  #    <站点根>/plugin-logos/<packid>.svg；
  # 3. 调用 xycloud 的插件发布接口，插件不存在则创建，存在则更新元信息、
  #    .oplg 包地址与 logo 线上地址。
  sync-market:
    needs:
      - discover
      - package
    # 这里必须显式带一个状态函数，否则会被 GitHub 的隐式 success() 判死。
    # package 的 needs 里有 build-native；纯 web 插件（plugin.json 的 native.enabled
    # 为 false，如 otools-idphoto）会让 build-native 变成 skipped，而 job 级 if 在未使用
    # 状态函数时会被隐式加上 success()，success() 对「依赖闭包中存在 skipped 的 job」
    # 返回 false —— 结果就是 needs.package.result == 'success' 明明成立，job 仍被跳过。
    # 用 !cancelled() 抵消该隐式判断（比 always() 更严谨：取消运行时不再继续同步市场）。
    if: ${{ !cancelled() && needs.package.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # 多个插件同时发布时串行同步，避免并发推送 otools-website 冲突
    concurrency:
      group: sync-plugin-market
      cancel-in-progress: false
    steps:
      - name: Checkout publish repo
        uses: actions/checkout@v4
        with:
          path: publish

      - name: Clone OTools
        env:
          OTOOLS_TOKEN: ${{ secrets.OTOOLS_REPO_TOKEN }}
          OTOOLS_REF: ${{ github.event.inputs.otools_ref }}
        run: |
          if [ -z "$OTOOLS_TOKEN" ]; then
            echo "Missing secret OTOOLS_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 --branch "$OTOOLS_REF" "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/OTools.git" OTools
          cd OTools
          git submodule set-url vendor/otools-plugin-sdk "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/otools-plugin-sdk.git"
          git submodule set-url vendor/tauri-remote-service "https://x-access-token:${OTOOLS_TOKEN}@github.com/ootools/tauri-remote-service.git"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Checkout otools-website
        uses: actions/checkout@v4
        with:
          repository: ootools/otools-website
          ref: master
          path: otools-website
          # 不能用 GITHUB_TOKEN：它触发的 push 不会再触发 otools-website 的
          # Pages 部署工作流。若 OTOOLS_REPO_TOKEN 对 otools-website 有写权限，
          # 可以不额外配置 OTOOLS_WEBSITE_TOKEN。
          token: ${{ secrets.OTOOLS_WEBSITE_TOKEN || secrets.OTOOLS_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Verify plugin package asset
        env:
          PACKAGE_URL: https://github.com/${{ github.repository }}/releases/download/plugin-${{ needs.discover.outputs.packid }}-v${{ needs.discover.outputs.version }}/${{ needs.discover.outputs.packid }}-${{ needs.discover.outputs.version }}.oplg
        run: |
          set -euo pipefail
          code="$(curl -sSL -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 "$PACKAGE_URL" || true)"
          if [ "$code" != "200" ]; then
            echo "插件包地址不可用($code): $PACKAGE_URL" >&2
            exit 1
          fi
          echo "插件包地址可用: $PACKAGE_URL"

      # 先把 logo 落到官网仓库并推送，让 logo 线上地址可用后再写入插件市场。
      - name: Sync plugin logo
        id: sync
        run: |
          set -euo pipefail
          python publish/scripts/sync-plugin-market.py \
            --plugin-dir "OTools/plugins/${{ inputs.plugin_dir }}" \
            --website-dir otools-website \
            --release-repo "${{ github.repository }}" \
            --release-tag "plugin-${{ needs.discover.outputs.packid }}-v${{ needs.discover.outputs.version }}" \
            --packid "${{ needs.discover.outputs.packid }}" \
            --version "${{ needs.discover.outputs.version }}" \
            --website-base-url "${{ vars.OTOOLS_WEBSITE_BASE_URL || 'https://otools.lingyun.net' }}" \
            --skip-submit

      # 用 PAT 推送，才能触发 otools-website 的 Pages 部署工作流。
      - name: Commit and push plugin logo
        if: steps.sync.outputs.logo_changed == 'true'
        working-directory: otools-website
        run: |
          set -euo pipefail
          git config user.name "otools-publish-bot"
          git config user.email "otools-publish-bot@users.noreply.github.com"
          git add "public/plugin-logos/${{ needs.discover.outputs.packid }}.svg"
          if git diff --cached --quiet; then
            echo "logo 无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(plugin-logos): 同步 ${{ needs.discover.outputs.packid }} v${{ needs.discover.outputs.version }} logo"
          git pull --rebase origin master
          git push origin HEAD:master

      - name: Submit plugin metadata to market
        env:
          OTOOLS_MARKET_TOKEN: ${{ secrets.OTOOLS_MARKET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$OTOOLS_MARKET_TOKEN" ]; then
            echo "Missing secret OTOOLS_MARKET_TOKEN" >&2
            exit 1
          fi
          python publish/scripts/sync-plugin-market.py \
            --plugin-dir "OTools/plugins/${{ inputs.plugin_dir }}" \
            --website-dir otools-website \
            --release-repo "${{ github.repository }}" \
            --release-tag "plugin-${{ needs.discover.outputs.packid }}-v${{ needs.discover.outputs.version }}" \
            --packid "${{ needs.discover.outputs.packid }}" \
            --version "${{ needs.discover.outputs.version }}" \
            --changelog "${{ needs.package.outputs.changelog }}" \
            --api-url "${{ vars.OTOOLS_MARKET_API || 'https://otools-api.lingyun.net/api/v1/otools/plugin/publish' }}" \
            --website-base-url "${{ vars.OTOOLS_WEBSITE_BASE_URL || 'https://otools.lingyun.net' }}" \
            --skip-logo \
            --token "$OTOOLS_MARKET_TOKEN"
